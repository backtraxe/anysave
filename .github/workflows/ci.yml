name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, debug + release builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble release APK (unsigned without keystore properties)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Resolve version
        id: version
        run: echo "name=$(./gradlew -q :app:printVersionName | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Name debug APK after app + version
        run: cp app/build/outputs/apk/debug/app-debug.apk "AnySave-${{ steps.version.outputs.name }}-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AnySave-debug-${{ steps.version.outputs.name }}
          path: AnySave-${{ steps.version.outputs.name }}-debug.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
